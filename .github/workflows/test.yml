name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest pytest-asyncio
      # The reference site must pass the conformance checker. This is what
      # keeps SPEC.md, the schemas, the reference implementation and the
      # checker in agreement with each other.
      - run: pytest -q

      # The source tree and an installed wheel resolve the schema directory
      # differently; only testing the checkout hides a broken package.
      - name: Test the built wheel, not just the checkout
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --quiet dist/*.whl
          /tmp/wheeltest/bin/python -c "
          from catnector_protocol import schemas
          schemas.validate_wellknown({'protocol_versions':[1],'websocket_url':'wss://e.invalid/w'})
          print('installed wheel resolves its schemas')"
